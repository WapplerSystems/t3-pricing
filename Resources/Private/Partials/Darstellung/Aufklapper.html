<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:comment>
Karten ohne Merkmalsliste im Koerper - die Leistungen stehen darunter im
Aufklapper. Die Favoritenkarte steht offen, damit der empfohlene Tarif
ohne Klick vollstaendig zu lesen ist.
</f:comment>

<div class="ws-preise__karten ws-preise__karten--aufklapper" style="--ws-preise-spalten: {tarife -> f:count()};">
    <f:for each="{tarife}" as="tarif">
        <div class="ws-preise__karte{f:if(condition: tarif.plan.favourite, then: ' ws-preise__karte--favorit')}">

            <f:if condition="{tarif.plan.favourite} && {tarif.plan.badge}">
                <span class="ws-preise__plakette">{tarif.plan.badge}</span>
            </f:if>

            <div class="ws-preise__kopf">
                <f:if condition="{tarif.plan.eyebrow}">
                    <span class="ws-preise__kicker">{tarif.plan.eyebrow}</span>
                </f:if>
                <h3 class="ws-preise__name">{tarif.plan.title}</h3>
                <f:if condition="{tarif.plan.subtitle}">
                    <p class="ws-preise__unter">{tarif.plan.subtitle}</p>
                </f:if>
            </div>

            <f:if condition="{tarif.plan.description}">
                <div class="ws-preise__text"><f:format.html>{tarif.plan.description}</f:format.html></div>
            </f:if>

            <div class="ws-preise__fuss">
                <f:render partial="Teil/Preis" arguments="{_all}"/>
                <f:render partial="Teil/Knopf" arguments="{tarif: tarif}"/>
            </div>

            <f:if condition="{tarif.plan.favourite}">
                <f:then>
                    <details class="ws-preise__aufklapper" open="open">
                        <summary class="ws-preise__aufklapper-kopf">
                            <span><f:translate key="LLL:EXT:pricing/Resources/Private/Language/locallang.xlf:weitereLeistungen"/></span>
                            <svg class="ws-preise__pfeil" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                        </summary>
                        <div class="ws-preise__aufklapper-inhalt">
                            <f:render partial="Teil/Merkmale" arguments="{tarif: tarif, zeigeGruppentitel: 1}"/>
                        </div>
                    </details>
                </f:then>
                <f:else>
                    <details class="ws-preise__aufklapper">
                        <summary class="ws-preise__aufklapper-kopf">
                            <span><f:translate key="LLL:EXT:pricing/Resources/Private/Language/locallang.xlf:weitereLeistungen"/></span>
                            <svg class="ws-preise__pfeil" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                        </summary>
                        <div class="ws-preise__aufklapper-inhalt">
                            <f:render partial="Teil/Merkmale" arguments="{tarif: tarif, zeigeGruppentitel: 1}"/>
                        </div>
                    </details>
                </f:else>
            </f:if>

        </div>
    </f:for>
</div>

</html>
