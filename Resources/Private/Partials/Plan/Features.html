<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:comment>The feature groups of a plan on a card. Groups that belong in the comparison table only are left out here.</f:comment>
<f:for each="{plan.groups}" as="g">
    <f:if condition="{g.record.inCard}">
        <div class="ws-pricing__group ws-pricing__group--{g.record.layout}">
            <f:if condition="{showGroupTitles}">
                <div class="ws-pricing__group-title">{g.record.title}</div>
            </f:if>

            <f:if condition="{g.record.layout} == 'pairs'">
                <f:then>
                    <f:for each="{g.rows}" as="row">
                        <div class="ws-pricing__pair">
                            <span class="ws-pricing__pair-label">{row.attribute.title}</span>
                            <span class="ws-pricing__pair-value">{row.text}<f:if condition="{row.attribute.unit}"> {row.attribute.unit}</f:if></span>
                        </div>
                    </f:for>
                </f:then>
                <f:else>
                    <ul class="ws-pricing__list">
                        <f:for each="{g.rows}" as="row">
                            <f:if condition="{row.included} || {row.text}">
                                <li class="ws-pricing__list-item">
                                    <svg class="ws-pricing__check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
                                    <span>{row.attribute.title}<f:if condition="{row.text}"> <strong>{row.text}<f:if condition="{row.attribute.unit}"> {row.attribute.unit}</f:if></strong></f:if></span>
                                </li>
                            </f:if>
                        </f:for>
                    </ul>
                </f:else>
            </f:if>
        </div>
    </f:if>
</f:for>

</html>
