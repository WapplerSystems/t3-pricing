<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:comment>Ohne gepflegten Link wird bewusst nichts ausgegeben - kein leerer Knopf, kein Platzhalter.</f:comment>
<f:if condition="{tarif.plan.selectLink}">
    <f:link.typolink parameter="{tarif.plan.selectLink}" class="ws-preise__knopf{f:if(condition: tarif.plan.favourite, then: ' ws-preise__knopf--stark')}">{tarif.auswahltext}</f:link.typolink>
</f:if>

</html>
